          - region "What age groups do your programs cater to?":
            - paragraph [ref=e70]: We design experiences for ages 8 and up. School programs are grouped by grade, corporate outings are matched to team fitness levels, and independent trips list a suggested age range so you can pick the right adventure.
        - generic [ref=e71]:
          - heading [level=3] [ref=e72]:
            - button "How safe are the adventure activities?" [ref=e73] [cursor=pointer]
          - region "How safe are the adventure activities?":
            - paragraph [ref=e78]: Safety is built into every trip. We use certified gear, brief every participant before an activity, maintain small instructor-to-participant ratios, and carry a written safety protocol plus first-aid support on every outing.
        - generic [ref=e79]:
          - heading [level=3] [ref=e80]:
            - button "What should we pack for a camp or trek?" [ref=e81] [cursor=pointer]
          - region "What should we pack for a camp or trek?":
            - paragraph [ref=e86]: "After booking you receive a detailed packing list. Generally: comfortable trekking clothes, a reusable water bottle, sturdy shoes, a light jacket, and personal medication. We provide tents, sleeping gear, safety equipment, and meals."
        - generic [ref=e87]:
          - heading [level=3] [ref=e88]:
            - button "Do you provide food and stay?" [ref=e89] [cursor=pointer]
          - region "Do you provide food and stay?":
            - paragraph [ref=e94]: Yes. Overnight camps include tents, sleeping mats, and all meals. Day outings include snacks and refreshments. Dietary preferences can be shared at booking and we accommodate vegetarian, vegan, and common allergies.
        - generic [ref=e95]:
          - heading [level=3] [ref=e96]:
            - button "How do we book a trip?" [ref=e97] [cursor=pointer]
          - region "How do we book a trip?":
            - paragraph [ref=e102]: Click “Plan Your Escape” or “Register Interest” on any page, share your group size and preferred dates, and our team will call back within 24 hours with a tailored plan. No payment is required to reserve your interest.
        - generic [ref=e103]:
          - heading [level=3] [ref=e104]:
            - button "What is your cancellation policy?" [ref=e105] [cursor=pointer]
          - region "What is your cancellation policy?":
            - paragraph [ref=e110]: Cancellations made 14 days or more before departure receive a full refund. Between 7–14 days, 50% is refunded. Within 7 days, the trip is non-refundable but transferable to another participant or a future date subject to availability.
