          - generic [ref=e22]: Our story
          - heading "The beginning of Cliff-Inn Adventures" [level=2] [ref=e23]
          - paragraph [ref=e24]: It all started with four adventure enthusiasts, gathered around a cafe, sharing a common dream — to make adventure accessible to everyone. With a passion for exploration and a vision to create meaningful outdoor experiences, they set out to build something extraordinary. This dream gave birth to Cliff-Inn Adventures — a dedicated team of skilled professionals and nature enthusiasts, united by a love for adventure and a commitment to sharing it with the world.
          - paragraph [ref=e25]: At the heart of our journey lies a deep focus on safety, personal growth, and the power of outdoor experiences. We go beyond just activities; we foster connections, self-discovery, and the excitement of pushing boundaries. At Cliff-Inn Adventures, we believe that adventure is a universal language — one that transcends age, background, and experience. Our mission is to create unforgettable moments that inspire, challenge, and leave lasting memories.
        - img "Team gathered around a campfire" [ref=e27]
