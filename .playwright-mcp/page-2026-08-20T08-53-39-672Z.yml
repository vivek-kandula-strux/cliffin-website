          - heading "Commitment To Safety & Security" [level=3] [ref=e94]
          - paragraph [ref=e95]: Certified instructors, strict protocols, helmets, harnesses, first aid, and medical support on-site. 24/7 supervision and emergency assistance — your safety is our top priority.
        - article [ref=e96]:
