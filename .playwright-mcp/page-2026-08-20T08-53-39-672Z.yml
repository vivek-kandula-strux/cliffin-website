          - heading "Sustainability & Eco-Friendly Tourism" [level=3] [ref=e98]
          - paragraph [ref=e99]: Eco-conscious practices, Leave No Trace policy, and educational nature walks that teach students and teams to respect and conserve the natural world.
        - article [ref=e100]:
