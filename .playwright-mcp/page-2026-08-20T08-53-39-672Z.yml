          - heading "Premium Hospitality & Seamless Experience" [level=3] [ref=e102]
          - paragraph [ref=e103]: Hygienic, well-maintained tents, dorms and eco-lodges, delicious meals catered to all dietary preferences, and friendly professional staff ensuring an enjoyable adventure.
