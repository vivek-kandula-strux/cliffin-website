          - heading "Every experience is by design" [level=2] [ref=e118]
          - paragraph [ref=e119]: At Cliff-Inn Adventures, every experience is designed to inspire, challenge, and create lasting memories. We believe that adventure is more than just an activity — it's a journey of discovery, learning, and growth.
          - paragraph [ref=e120]: With a passion for outdoor exploration and experiential learning, we craft unique and immersive experiences for schools and corporations. Whether it's a thrilling camping expedition, an action-packed adventure workshop, or an educational excursion, we ensure every moment is engaging, meaningful, and unforgettable.
          - paragraph [ref=e121]: Our commitment to safety, excellence, and innovation sets us apart, making us the perfect choice for those looking to go beyond the ordinary and embrace the extraordinary.
